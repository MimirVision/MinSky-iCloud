[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "minsky-icloud"
dynamic = ["version"]
description = "Flytt bilder og videoer fra Telenor Min Sky til iCloud-bilder – trygt og gjenopptakbart."
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
minsky-icloud = "minsky_icloud.cli:main"

[tool.setuptools.dynamic]
version = {attr = "minsky_icloud.__version__"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
minsky_icloud = ["ui/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
